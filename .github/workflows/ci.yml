name: Go Continuous Integration

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "RA-dev-main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod download
          go mod verify

      - name: Check Code Formatting
        run: |
          unformatted=$(find . -name "*.go" -not -path "*/vendor/*" -print0 | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            echo "Please run 'gofmt -w .' on your local files."
            exit 1
          fi

      - name: Static Analysis
        run: |
          echo "Running go vet..."
          go vet ./...
          
          echo "Running staticcheck..."
          go install honnef.co/go/tools/cmd/staticcheck@latest
          $(go env GOPATH)/bin/staticcheck ./...
          
          echo "Running govulncheck..."
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
          
          echo "Running gosec (Advisory only)..."
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec ./... || echo "gosec found potential issues, but treating as advisory."

      - name: Run Unit Tests
        run: go test -v -race -p=1 ./...

      - name: Compile Code
        run: go build -v ./...

      # End of CI workflow
